[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luxresume"
version = "0.1.3"
description = "Generate ATS-friendly PDF resumes from YAML files using yamlrender"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    { name="Mizuki Hikaru", email="mizuki@hikaru.org" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "yamlrender",
]
readme = "README.md"

[project.scripts]
luxresume = "luxresume.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/luxresume"]
